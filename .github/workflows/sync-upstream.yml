name: Sync Upstream

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

env:
  UPSTREAM: https://github.com/arthenica/ffmpeg-kit-next.git
  UPSTREAM_BRANCH: main

jobs:
  sync:
    name: Merge upstream ${{ github.event.repository.default_branch }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # GITHUB_TOKEN cannot push changes to .github/workflows; set SYNC_TOKEN (PAT with repo and workflow scopes) for that case.
          token: ${{ secrets.SYNC_TOKEN || github.token }}

      - name: Merge upstream
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git config user.name "RoTatsuLabs"
          git config user.email "333611342+RoTatsuLabs@users.noreply.github.com"
          git remote add upstream "$UPSTREAM"
          git fetch --no-tags upstream "$UPSTREAM_BRANCH"
          if git merge-base --is-ancestor "upstream/$UPSTREAM_BRANCH" HEAD; then
            echo "Already up to date with upstream/$UPSTREAM_BRANCH" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          GIT_AUTHOR_NAME="$(git log -1 --format=%an "upstream/$UPSTREAM_BRANCH")" \
          GIT_AUTHOR_EMAIL="$(git log -1 --format=%ae "upstream/$UPSTREAM_BRANCH")" \
          git merge --no-ff -m "chore: sync with upstream $UPSTREAM_BRANCH" "upstream/$UPSTREAM_BRANCH"
          git push origin HEAD
          gh workflow run android-maven.yml --ref "$DEFAULT_BRANCH" -f revision=auto -f profile=full -f publish=true
          echo "Merged upstream/$UPSTREAM_BRANCH at $(git rev-parse --short "upstream/$UPSTREAM_BRANCH")" >> "$GITHUB_STEP_SUMMARY"
